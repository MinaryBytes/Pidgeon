<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pidgeon — process diagram editor</title>
<meta name="description" content="Free, open-source editor for pharma PFDs, P&IDs and single-use assembly drawings. Runs in your browser.">
<link rel="icon" href="../assets/pidgeon.svg" type="image/svg+xml">
<style>
:root{--bg:#f4f5f7;--panel:#fff;--line:#e3e6eb;--ink:#1f2a37;--muted:#6b7280;--accent:#0f766e;--accent-soft:#e6f4f2;--sel:#0ea5e9}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);font-size:13px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:grid;grid-template-columns:236px 1fr 252px;grid-template-rows:48px 1fr;height:100vh}
header{grid-column:1/4;display:flex;align-items:center;gap:4px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0;overflow-x:auto}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-right:10px;white-space:nowrap}
.brand small{font-weight:500;color:var(--muted);font-size:12px}
.btn{border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 9px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.btn:hover{background:#eef0f3}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:#0d6660}
.btn.outline{border-color:var(--line);background:#fff}
.btn.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.btn:disabled{opacity:.35;cursor:default;background:transparent}
.sep{width:1px;height:22px;background:var(--line);margin:0 6px;flex:none}
.spacer{flex:1}
#zoomLbl{min-width:48px;text-align:center;font-variant-numeric:tabular-nums}
header select{border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:#fff}
/* palette */
#palette{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#palSearch{margin:10px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;outline:none}
#palSearch:focus{border-color:var(--accent)}
#palList{overflow-y:auto;padding:0 8px 16px;flex:1}
.cat{margin-top:6px}
.cat h4{margin:0;padding:6px 4px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);cursor:pointer;display:flex;justify-content:space-between;user-select:none}
.cat.closed .grid{display:none}
.cat.closed h4 span:last-child{transform:rotate(-90deg)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.pal-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px 5px;border-radius:6px;cursor:grab;border:1px solid transparent;user-select:none;touch-action:none}
.pal-item:hover{background:#f1f5f9;border-color:var(--line)}
.pal-item svg{width:44px;height:40px;pointer-events:none}
.pal-item span{font-size:10px;text-align:center;line-height:1.15;color:#374151}
.ghost{position:fixed;pointer-events:none;z-index:50;transform:translate(-50%,-50%);opacity:.8}
.ghost svg{width:64px;height:58px}
/* stage */
#stage{position:relative;min-width:0;min-height:0;overflow:hidden}
#cv{width:100%;height:100%;display:block;background:#fbfbfc;touch-action:none;user-select:none;-webkit-user-select:none}
#cv.panning{cursor:grabbing}
#cv.space{cursor:grab}
.port{fill:#fff;stroke:var(--sel);stroke-width:1.5;opacity:0;cursor:crosshair}
.port.q{stroke-width:1.2}
.node:hover .port,#cv.connecting .port,.node.sel .port{opacity:1}
.port:hover{fill:var(--sel)}
.node{cursor:move}
.ehit{cursor:pointer}
.handle{fill:#fff;stroke:var(--sel);stroke-width:1.5;cursor:nwse-resize}
.eend{fill:#fff;stroke:var(--sel);stroke-width:1.5;cursor:crosshair}
.stepbar{margin-left:auto;align-self:center;display:flex;align-items:center;gap:4px;padding:0 4px 3px;font-size:12px;color:#5b21b6;font-weight:600;flex:none}
.stepbar select{font-size:12px;padding:3px 6px;border:1px solid #c4b5fd;border-radius:6px;background:#faf5ff;color:#3b0764;max-width:220px}
.sbtn{border:1px solid #c4b5fd;background:#fff;color:#5b21b6;border-radius:6px;width:24px;height:24px;cursor:pointer;font-size:14px;line-height:1}
.sbtn:disabled{opacity:.35;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 9px;font-size:12px;cursor:pointer;color:#374151}
.chip.on{background:#f3e8ff;border-color:#a78bfa;color:#5b21b6;font-weight:600}
.chip.part{background:repeating-linear-gradient(45deg,#f3e8ff,#f3e8ff 4px,#fff 4px,#fff 8px);border-color:#c4b5fd}
.step-row{display:flex;gap:4px;align-items:center;margin-bottom:5px}.step-row b{width:18px;color:#5b21b6;font-size:12px}.step-row input{flex:1;min-width:0}
.step-row .btn{padding:3px 7px}
#tabs{position:absolute;left:0;right:0;bottom:0;height:34px;display:flex;align-items:flex-end;gap:2px;padding:0 8px;background:linear-gradient(to top,#eef0f3,#eef0f3 80%,transparent);overflow-x:auto;z-index:5}
.tab{display:flex;align-items:center;gap:6px;padding:5px 12px 6px;border:1px solid var(--line);border-bottom:none;border-radius:7px 7px 0 0;background:#e9ecef;cursor:pointer;white-space:nowrap;font-size:12px;color:#4b5563;user-select:none}
.tab:hover{background:#f8fafc}
.tab.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 -1px 0 var(--accent) inset}
.tab .tmenu{border:none;background:transparent;cursor:pointer;padding:0 2px;color:var(--muted);font-size:13px;line-height:1}
.tab .tmenu:hover{color:var(--ink)}
.tab-add{border:1px dashed #cbd5e1;background:transparent;border-radius:7px 7px 0 0;padding:4px 10px 5px;cursor:pointer;color:var(--muted);font-size:13px}
.tab-add:hover{color:var(--accent);border-color:var(--accent)}
#status{position:absolute;right:10px;bottom:40px;font-size:11px;color:var(--muted);background:rgba(255,255,255,.85);padding:3px 8px;border-radius:5px;pointer-events:none}
#editor{position:absolute;display:none;z-index:20;width:180px;min-height:28px;padding:4px 6px;border:1.5px solid var(--sel);border-radius:5px;font-size:12px;text-align:center;resize:none;outline:none;box-shadow:0 4px 14px rgba(0,0,0,.12)}
/* props */
#props{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:14px}
#props h3{margin:0 0 2px;font-size:14px}
#props .sub{color:var(--muted);font-size:12px;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:600;color:#4b5563;margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em}
.field input,.field select,.field textarea{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:52px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:22px;height:22px;border-radius:50%;border:1px solid #cbd5e1;cursor:pointer}
.sw.on{outline:2px solid var(--accent);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.btns .btn{border-color:var(--line);background:#fff;font-size:12px;padding:4px 8px}
.btns .btn.danger{color:#b91c1c}
.btns .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.tips{font-size:12px;color:#4b5563;line-height:1.55;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.tips b{color:var(--ink)}
kbd{font-family:inherit;font-size:11px;border:1px solid #d1d5db;border-bottom-width:2px;border-radius:4px;padding:0 4px;background:#fff}
.sect{border:1px solid var(--line);border-radius:8px;margin-bottom:12px;background:#fff}
.sect summary{padding:8px 10px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:#374151;cursor:pointer;user-select:none}
.sect[open] summary{border-bottom:1px solid var(--line)}
.sect-b{padding:10px 10px 2px}
.chk,.field .chk{display:flex;align-items:center;gap:8px;margin:0 0 8px;cursor:pointer;font-size:12px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink)}
.chk input,.field .chk input{width:auto;margin:0}
.rev-row{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.rev-row input,.rev-row textarea{padding:4px 6px;border:1px solid var(--line);border-radius:5px;font-size:12px}
.rev-row textarea{width:100%;resize:vertical}
.rev-row .btn{padding:2px 7px;border:1px solid var(--line)}
.issue{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.issue:hover{background:#f1f5f9;border-color:var(--line)}
.issue .sev{flex:none;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;margin-top:1px}
.sev.err{background:#fee2e2;color:#b91c1c}.sev.warn{background:#fef3c7;color:#92400e}.sev.ok{background:#dcfce7;color:#166534}
.rep-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f1f5f9}
.rep-row b{flex:1}
.rep-row span{color:var(--muted);font-size:12px;min-width:60px;text-align:right}
.lt-row{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.lt-row:hover{background:#f1f5f9}
.lt-row.on{border-color:var(--accent);background:var(--accent-soft)}
.lt-row svg{flex:none}
/* modal */
#modalBg{position:fixed;inset:0;background:rgba(15,23,42,.38);display:none;align-items:center;justify-content:center;z-index:100}
#modal{background:#fff;border-radius:12px;width:min(640px,92vw);max-height:86vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
#modal .mh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
#modal .mh h2{margin:0;font-size:15px}
#modal .mb{padding:16px 18px}
.tpl-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tpl{border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;text-align:left;background:#fff}
.tpl:hover{border-color:var(--accent);background:var(--accent-soft)}
.tpl b{display:block;margin-bottom:4px}
.tpl span{color:var(--muted);font-size:12px;line-height:1.4}
.exp-sec{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.exp-sec>b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:#374151;margin-bottom:6px}
.exp-opts{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.exp-opts label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:600;color:#4b5563;flex:1;min-width:180px}
.exp-opts select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;font-weight:400}
.exp-prev{border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px;text-align:center;margin-bottom:12px}
.exp-prev img{max-width:100%;max-height:300px}
.note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:8px 14px;border-radius:8px;font-size:12px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
table.keys{border-collapse:collapse;width:100%}
table.keys td{padding:5px 4px;border-bottom:1px solid #f1f5f9;vertical-align:top}
table.keys td:first-child{white-space:nowrap;width:44%}
@media (max-width:900px){#app{grid-template-columns:180px 1fr}#props{display:none}header{grid-column:1/3}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 32 32" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><circle cx="20" cy="9" r="5"/><path d="M15 9h10"/><path d="M25 7.5l4 2.5-4 1.5"/><path d="M17 13.5C10 15 5 20 4 27h17c3-3.5 3-9.5-1.5-13"/><path d="M9 21h9"/><path d="M11 27v3M16 27v3"/></svg>
      Pidgeon <small>diagram editor</small>
    </div>
    <button class="btn" id="bNew" title="New diagram">New</button>
    <button class="btn" id="bTpl" title="Start from a template">Templates</button>
    <button class="btn" id="bOpen" title="Open a saved .json diagram">Open</button>
    <button class="btn primary" id="bExport" title="Save / export">Save &amp; export</button>
    <div class="sep"></div>
    <button class="btn" id="bUndo" title="Undo (Ctrl+Z)">↶</button>
    <button class="btn" id="bRedo" title="Redo (Ctrl+Y)">↷</button>
    <div class="sep"></div>
    <button class="btn" id="bZo" title="Zoom out">−</button>
    <span id="zoomLbl">100%</span>
    <button class="btn" id="bZi" title="Zoom in">+</button>
    <button class="btn" id="bFit" title="Fit to screen (F)">Fit</button>
    <div class="sep"></div>
    <button class="btn on" id="bGrid" title="Show grid">Grid</button>
    <button class="btn on" id="bSnap" title="Snap to grid">Snap</button>
    <button class="btn" id="bSizes" title="Show connector sizes on markers">Sizes</button>
    <button class="btn" id="bTags" title="Show line tags and tubing specs">Tags</button>
    <div class="sep"></div>
    <button class="btn" id="bReports" title="Equipment, line, instrument and valve lists, BOM, drawing check">Reports</button>
    <div class="spacer"></div>
    <label style="display:flex;align-items:center;gap:6px;white-space:nowrap;color:var(--muted)">Type
      <select id="modeSel"><option value="pfd">PFD</option><option value="pid">P&amp;ID</option><option value="su">Single Use Flow Diagram</option></select></label>
    <label style="display:flex;align-items:center;gap:6px;white-space:nowrap;color:var(--muted)">New line
      <select id="lineSel"></select></label>
    <button class="btn" id="bHelp" title="Shortcuts">?</button>
  </header>

  <aside id="palette">
    <input id="palSearch" placeholder="Search symbols (e.g. column, lyo)…">
    <div id="palList"></div>
  </aside>

  <main id="stage">
    <svg id="cv" xmlns="http://www.w3.org/2000/svg">
      <defs id="defs"></defs>
      <rect id="gridbg" x="0" y="0" width="100%" height="100%" fill="url(#grid)"/>
      <g id="world"><g id="Lz"></g><g id="Le"></g><g id="Ln"></g><g id="Lo"></g></g>
    </svg>
    <textarea id="editor" rows="1"></textarea>
    <div id="tabs"></div>
    <div id="status"></div>
  </main>

  <aside id="props"></aside>
</div>

<div id="modalBg"><div id="modal"><div class="mh"><h2 id="mTitle"></h2><button class="btn" id="mClose">✕</button></div><div class="mb" id="mBody"></div></div></div>
<input type="file" id="fileIn" accept=".json,application/json" style="display:none">
<div class="toast" id="toast"></div>

<script>
'use strict';
const INK = '#1f2a37';
const FONT = 'Inter, Segoe UI, Helvetica, Arial, sans-serif';
const GRID = 10;
const STORE = 'pidgeon-v1', LEGACY_STORE = 'pharmaflow-pfd-v1';
const REPO_URL = 'https://github.com/MinaryBytes/Pidgeon';
const DIRS = {n:[0,-1], e:[1,0], s:[0,1], w:[-1,0]};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const T = (x, y, s, opt = {}) => `<text x="${x}" y="${y}" font-size="${opt.size || 10}" font-weight="${opt.weight || 600}" text-anchor="${opt.anchor || 'middle'}" fill="${opt.fill || INK}" stroke="none" font-family="${FONT}">${esc(s)}</text>`;

/* ---------- Line (stream) types ---------- */
const LINES = {
  process:  {name:'Process stream',            color:'#1f2a37', w:2,   dash:''},
  sutube:   {name:'Single-use tubing',         color:'#0891b2', w:1.8, dash:'', wavy:true},
  utility:  {name:'Utility (WFI, steam, gas)', color:'#2563eb', w:1.6, dash:'8 4'},
  cip:      {name:'CIP / SIP',                 color:'#0f766e', w:1.6, dash:'6 2 2 2'},
  transfer: {name:'Manual / mobile transfer',  color:'#7c3aed', w:1.8, dash:'14 6'},
  waste:    {name:'Waste / drain',             color:'#92400e', w:1.6, dash:'10 3 2 3'},
  proconn:  {name:'Instrument process connection', color:'#475569', w:1, dash:'', sig:true},
  signal:   {name:'Control signal (generic)',  color:'#6b7280', w:1.2, dash:'2 3', sig:true},
  electric: {name:'Electrical signal',         color:'#6b7280', w:1.2, dash:'7 4', sig:true},
  pneumatic:{name:'Pneumatic signal',          color:'#6b7280', w:1.2, dash:'', sig:true, decor:'pneu'},
  datalink: {name:'Data link (software)',      color:'#6b7280', w:1.2, dash:'', sig:true, decor:'data'},
  capillary:{name:'Capillary tube',            color:'#6b7280', w:1.2, dash:'', sig:true, decor:'cap'}
};
// Repeating marks along ISA-5.1 signal lines
const DECOR = {
  pneu: `<path d="M-4,5 L0,-5 M0,5 L4,-5" stroke-width="1.2"/>`,
  data: `<circle r="2.6" fill="#fff" stroke-width="1.1"/>`,
  cap:  `<path d="M-3,-3 L3,3 M-3,3 L3,-3" stroke-width="1.2"/>`
};
function decorAlong(L, pts) {
  if (!L.decor) return '';
  const len = pathLen(pts); let o = '';
  for (let d = 16; d < len - 12; d += 26) { const [x, y, a] = pointAt(pts, d); o += `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${(a*180/Math.PI).toFixed(1)})" fill="none" stroke="${L.color}" pointer-events="none">${DECOR[L.decor]}</g>`; }
  return o;
}
/* ---------- Connection indicators (drawn on lines; glyph axis = line direction) ---------- */
const AC = '#0e7490'; // aseptic family colour
const CONNS = {
  // Stainless / hygienic
  tc:     {fam:'ss', name:'Tri-Clamp (sanitary clamp)', svg:`<rect x="-4.5" y="-7" width="9" height="13" fill="#fff" stroke="none"/><path d="M-2.6,-6 V6 M2.6,-6 V6" stroke-width="1.8"/><path d="M-4.5,-6 Q0,-11.5 4.5,-6" stroke-width="1.2"/>`},
  flange: {fam:'ss', name:'Flanged', svg:`<rect x="-4" y="-8" width="8" height="16" fill="#fff" stroke="none"/><path d="M-2.5,-8 V8 M2.5,-8 V8" stroke-width="2.4"/>`},
  weld:   {fam:'ss', name:'Butt weld (orbital)', svg:`<circle r="3.6" fill="${INK}" stroke="none"/>`},
  thread: {fam:'ss', name:'Threaded', svg:`<rect x="-3" y="-7" width="8" height="14" fill="#fff" stroke="none"/><path d="M-1.5,-7 V7" stroke-width="2"/><path d="M1.5,-4 L4.5,-6.5 M1.5,1 L4.5,-1.5 M1.5,6 L4.5,3.5" stroke-width="1"/>`},
  qc:     {fam:'ss', name:'Quick-connect (non-sterile)', svg:`<rect x="-5" y="-6" width="10" height="12" fill="#fff" stroke="none"/><path d="M-4,-5 L1.5,0 L-4,5 M4,-5 V5" stroke-width="1.6"/>`},
  hose:   {fam:'ss', name:'Hose / transfer panel', svg:`<rect x="-6" y="-5" width="12" height="10" fill="#fff" stroke="none"/><path d="M-6,0 Q-3,-5 0,0 T6,0" stroke-width="1.6"/>`},
  sssu:   {fam:'ss', name:'SS ↔ SU transition (TC-to-barb)', svg:`<rect x="-4.5" y="-7" width="13" height="14" fill="#fff" stroke="none"/><path d="M-2.5,-6 V6" stroke-width="1.8"/><circle cx="3.5" cy="0" r="3.6" fill="${AC}" stroke="${AC}"/>`},
  // Aseptic / single-use
  ac:     {fam:'as', name:'Aseptic connector (genderless)', svg:`<circle r="5.5" fill="#fff"/><path d="M0,-5.5 A5.5,5.5 0 0 0 0,5.5 Z" fill="${AC}" stroke="none"/>`},
  stc:    {fam:'as', name:'Steam-through connector (SIP)', svg:`<circle r="5.5" fill="#fff"/><path d="M-3.9,-3.9 L3.9,3.9 M-3.9,3.9 L3.9,-3.9" stroke-width="1.2"/>`},
  adc:    {fam:'as', name:'Aseptic disconnector', svg:`<rect x="-7.5" y="-6" width="15" height="12" fill="#fff" stroke="none"/><path d="M-1.5,-5.5 A5.5,5.5 0 0 0 -1.5,5.5 Z M1.5,-5.5 A5.5,5.5 0 0 1 1.5,5.5 Z" fill="#fff"/>`},
  tweld:  {fam:'as', name:'Sterile tube weld', svg:`<path d="M0,-5 L5,0 L0,5 L-5,0 Z" fill="${AC}"/>`},

// mk() with rotation: dimensions swap at 90/270 and the part stays centred on (cx, cy)
function mkRot(d, type, cx, cy, rot, extra = {}) {
  const s = SYM[type], sw = rot === 90 || rot === 270;
  const w = sw ? s.h : s.w, h = sw ? s.w : s.h;
  const n = {id:uid(), type, x:Math.round(cx - w/2), y:Math.round(cy - h/2), w, h, label:s.label, tag:'', ...(rot ? {rot} : {}), ...(s.su ? {su:true} : {}), ...extra};
  d.nodes.push(n); return n;
}
function tplPID() {
  const {d, mk, ln} = builder('Buffer hold tank T-101');
  Object.assign(d, {mode:'pid', showLineData:true, showEqData:true, showSizes:true});
  const SF4 = {spec:'SS-BPE-SF4'}, Y0 = 330, YO = 500;
  const tank = mk('tank', 560, Y0, 'Buffer hold tank', 'T-101', {vol:'500 L', moc:'316L SF4', dp:'FV / 3 barg', dt:'-10 / 150 °C'});
  const ty = n => tank.y + tank.h * n;            // y of a side nozzle at fraction n
  // CIP supply to spray ball (top, N2)
  const cips = mk('utility', 120, 110, 'CIPS', '');
  const v103 = mk('valve', 300, 110, '', 'V-103', {detail:'1.5" TC, EPDM'});
  ln(cips, v103, 'e', 'w', 'cip', '', {size:'1.5"', service:'CIPS', lineNo:'1002', ...SF4, arrow:'none'});
  ln(v103, tank, 'e', 'n1', 'cip', '', {size:'1.5"', service:'CIPS', lineNo:'1002', ...SF4, toNoz:'N1', cTo:'tc', cToSize:'1.5"'});
  // Vent filter (top, N1)
  const vent = mk('vent-filter', tank.x + 45, 190, '0.2 µm vent', 'FV-101', {detail:'Heated, hydrophobic PTFE'});
  ln(vent, tank, 's', 'n2', 'process', '', {size:'1"', service:'VNT', lineNo:'1005', ...SF4, toNoz:'N2', arrow:'none'});
  // WFI supply with interlocked on/off valve (side, N3)
  const wfi = mk('utility', 120, ty(.25), 'WFI', '');
  const xv = mk('sov', 300, ty(.25), '', 'XV-101', {fail:'FC', detail:'1" TC, EPDM diaphragm'});
  ln(wfi, xv, 'e', 'w', 'utility', '', {size:'1"', service:'WFI', lineNo:'1001', ...SF4, arrow:'none'});
  ln(xv, tank, 'e', 'w1', 'utility', '', {size:'1"', service:'WFI', lineNo:'1001', ...SF4, toNoz:'N3', cTo:'tc', cToSize:'1"'});
  // Level transmitter -> high-high interlock -> closes XV-101
  const lt = mk('instrument', 440, ty(.75) + 30, 'LIT 101', '', {ikind:'shared', iloc:'main'});
  ln(lt, tank, 'n', 'w2', 'proconn', '', {arrow:'none', toNoz:'N4'});
  const il = mk('interlock', 300, 210, 'I 101', '', {});
  d.nodes.push({id:uid(), type:'text', x:225, y:180, w:60, h:20, label:'LAHH'});
  ln(lt, il, 'w', 'e', 'datalink', '', {arrow:'none'});
  ln(il, xv, 's', 'n', 'electric', '', {arrow:'end'});
  // Temperature transmitter (side, N5)
  const tt = mk('instrument', 690, ty(.25), 'TIT 102', '', {ikind:'shared', iloc:'main'});
  ln(tt, tank, 'w', 'e1', 'proconn', '', {arrow:'none', toNoz:'N5'});
  // Outlet: zero-static valve (drain branch) -> pump -> flow element -> control valve -> off-page
  const zs = mk('zs-valve', 680, YO, '', 'V-102', {detail:'1.5" TC, zero-static'});
  ln(tank, zs, 's', 'w', 'process', '', {size:'1.5"', service:'BUF', lineNo:'1003', ...SF4, fromNoz:'N6', cFrom:'tc', cFromSize:'1.5"', arrow:'none'});
  const pump = mk('pump', 800, YO, 'Transfer pump', 'P-101', {moc:'316L SF4'});
  ln(zs, pump, 'e', 'w', 'process', '', {size:'1.5"', service:'BUF', lineNo:'1003', ...SF4, arrow:'none'});
  const fe = mk('flow-elem', 930, YO, '', 'FE-104', {detail:'1" magmeter'});

  const off = mk('offpage', 1300, YO, 'To PID-002', '');
  ln(cv, off, 'e', 'w', 'process', '', {size:'1"', service:'BUF', lineNo:'1003', ...SF4});
  const fic = mk('instrument', 995, YO - 120, 'FIC 104', '', {ikind:'shared', iloc:'main'});

  ln(fic, cv, 'e', 'n', 'electric', '', {arrow:'end'});
  const drn = mk('drain', 680, YO + 130, 'Drain', '');

  d.nodes.push({id:uid(), type:'legend', x:1120, y:70, w:260, h:150, label:''});
  d.nodes.push({id:uid(), type:'titleblock', x:1080, y:640, w:300, h:100, label:'', meta:{docno:'PID-001', rev:'A', date:new Date().toISOString().slice(0,10), site:'Buffer preparation', by:'', status:'Issued for review'}});
  d.nodes.push({id:uid(), type:'revtable', x:1080, y:750, w:300, h:60, label:''});
  d.revs = [{rev:'A', date:new Date().toISOString().slice(0,10), by:'', desc:'Issued for design review'}];
  return d;
}
function tplSU() {
  const {d, mk, ln} = builder('50 L buffer bag assembly');
  Object.assign(d, {mode:'su', showLineData:true, showSizes:true});
  const T = (m, i, o, l) => ({type:'sutube', arrow:'end', tubeMat:m, tubeId:i, tubeOd:o, tubeLen:l});
  const bag = mk('bag', 520, 330, '50 L 2D bag', 'BG-1', {detail:'50 L, EVA/PE film, 4 ports'});
  const yw1 = bag.y + bag.h * .25, yw2 = bag.y + bag.h * .75, ye2 = yw2;
  // Fill line: aseptic connector -> pinch clamp -> bag (port w1)
  const ac1 = mk('aseptic-conn', 150, yw1, '', '', {detail:'½" HB, genderless, w/ cap'});
  const pc1 = mk('pinch-clamp', 290, yw1, '', '', {detail:'for ½" ID tubing'});
  ln(ac1, pc1, 'e', 'w', 'sutube', '', T('TPE', '½"', '¾"', '12"'));
  ln(pc1, bag, 'e', 'w1', 'sutube', '', {...T('TPE', '½"', '¾"', '24"'), cTo:'tie', cToSize:'½" HB'});
  // Sampling port (w2)

  ln(nfv, bag, 'e', 'w2', 'sutube', '', {...T('Platinum-cured silicone', '⅛"', '¼"', '6"'), arrow:'start', cFrom:'luer', cFromSize:'Female luer', cTo:'tie', cToSize:'⅛" HB'});
  // Vent (top)

  // Outlet (e2) with tee: process connector + sample bag branch
  const tee = mk('su-tee', 700, ye2, '', '', {detail:'⅜" × ⅜" × ⅛" HB reducing tee, polypropylene'});
  ln(bag, tee, 'e2', 'w', 'sutube', '', {...T('TPE', '⅜"', '⅝"', '12"'), cFrom:'tie', cFromSize:'⅜" HB'});
  const pc2 = mk('pinch-clamp', 830, ye2, '', '', {detail:'for ⅜" ID tubing'});
  ln(tee, pc2, 'e', 'w', 'sutube', '', T('TPE', '⅜"', '⅝"', '18"'));

  const sb = mk('sample-bag', 700, ye2 + 220, 'Sample bag', '', {detail:'100 mL'});
  ln(pc3, sb, 's', 'n', 'sutube', '', {...T('Platinum-cured silicone', '⅛"', '¼"', '6"'), cTo:'tie', cToSize:'⅛" HB'});
  d.nodes.unshift({id:uid(), type:'assembly', x:100, y:140, w:960, h:470, label:'ASM-1001', desc:'50 L buffer bag', steril:'Gamma'});
  d.nodes.push({id:uid(), type:'bom', x:1100, y:140, w:560, h:80, label:''});
  d.nodes.push({id:uid(), type:'legend', x:1100, y:560, w:260, h:150, label:''});
  d.nodes.push({id:uid(), type:'titleblock', x:100, y:650, w:300, h:100, label:'', meta:{docno:'ASM-1001', rev:'A', date:new Date().toISOString().slice(0,10), site:'Single-use assemblies', by:'', status:'Draft'}});
  d.nodes.push({id:uid(), type:'revtable', x:420, y:650, w:300, h:60, label:''});
  d.revs = [{rev:'A', date:new Date().toISOString().slice(0,10), by:'', desc:'Initial release for review'}];

}
const TEMPLATES = [
  ['blank', 'Blank canvas', 'Start from scratch.', () => ({title:'Untitled PFD', nodes:[], edges:[]})],
  ['mab', 'mAb drug substance', 'Seed train → perfusion N-1 → production → harvest → Protein A, VI, AEX/CEX, VF, UF/DF, BDS.', tplMab],
  ['fill', 'Aseptic fill–finish', 'Thaw/pool, redundant sterile filtration, isolator filling, lyo, capping, inspection, packaging.', tplFill],
  ['osd', 'Oral solid dose (tablet)', 'Dispense, wet granulation, FBD, milling, blending, compression, coating, blister.', tplOSD],
  ['pid', 'P&amp;ID — buffer hold tank', 'ISA-5.1 loops (LIT, TIT, FIC→CV), interlocked XV, zero-static drain valve, nozzles, line tags, line list.', tplPID],
  ['su', 'Single Use Flow Diagram — 50 L bag', 'Disposable component flow diagram: tubing specs, aseptic connectors, clamps, tee, sample bag, auto BOM.', tplSU]
];
function openTemplates(isNew) {
  openModal(isNew ? 'New diagram' : 'Templates', `<div class="tpl-grid">${TEMPLATES.map(([id, t, dsc]) => `<button class="tpl" data-tpl="${id}"><b>${t}</b><span>${dsc}</span></button>`).join('')}</div><p class="note">Starting a new diagram replaces the current canvas. Save it first (Save &amp; export → .json) if you want to keep it; Undo also brings it back.</p>`);
  $('#mBody').querySelectorAll('[data-tpl]').forEach(b => b.onclick = () => {
    const t = TEMPLATES.find(x => x[0] === b.dataset.tpl);
    const prev = hist.slice(0, hi + 1);
    loadDoc(t[3]());
    hist = prev.concat(hist); hi = hist.length - 1; render();
    closeModal();
  });
}
function openHelp() {
  const rows = [['Drag symbol → canvas','Add shape'],['Drop valve / fitting on a line','Insert it inline (splits the line)'],['R','Rotate 90°'],['Drag from blue port','Connect two shapes'],['Double-click / Enter','Edit label'],['Drag empty canvas','Box-select'],['Shift + click','Add to selection'],['Space + drag, or scroll','Pan'],['Ctrl + scroll / pinch','Zoom'],['F','Fit diagram to screen'],['Delete','Delete selection'],['Ctrl + C / V / D','Copy / paste / duplicate'],['Ctrl + Z / Y','Undo / redo'],['Arrow keys (+Shift)','Nudge 10 px (50 px)'],['Ctrl + S','Save & export']];
  openModal('Keyboard & mouse', `<table class="keys">${rows.map(([a,b]) => `<tr><td><b>${a}</b></td><td>${b}</td></tr>`).join('')}</table><p class="note">Line types follow common PFD conventions: solid = process stream, solid cyan = single-use tubing (closed SU flowpath), dashed blue = utility, dash-dot teal = CIP/SIP, long-dash purple = manual or mobile-vessel transfer, brown = waste, dotted grey = control signal. Cleanroom zones use EU GMP Annex 1 grades.</p><p class="note"><b>Pidgeon</b> is created by Minhazuddin Mohammed (MinaryBytes) and is free and open source under the MIT licence. It runs entirely in your browser: drawings are stored on this device and in the files you save, never uploaded. It is not validated for GMP use — treat drawings as drafts until issued through your controlled document system. Source code and issues: <a href="${REPO_URL}" target="_blank" rel="noopener">${REPO_URL.replace('https://', '')}</a></p>`);
}

$('#lineSel').onchange = e => { settings.line = e.target.value; if (!sel.size) renderProps(); };
window.addEventListener('resize', () => render());

/* ---------- Boot ---------- */
$('#defs').innerHTML = defsSVG(true);
buildPalette();
let saved = null;
try { saved = JSON.parse(localStorage.getItem(STORE) || localStorage.getItem(LEGACY_STORE) || 'null'); } catch (_) {}
try { if (saved && ((saved.sheets && saved.sheets.some(sh => sh.nodes && sh.nodes.length)) || (saved.nodes && saved.nodes.length))) loadDoc(saved, false); else loadDoc(tplMab(), false); }
catch (_) { loadDoc(tplMab(), false); }
// Deep link from the website: /app/#template-pid opens that template (Undo returns to the previous drawing)
const tplHash = (location.hash.match(/^#template-([a-z]+)$/) || [])[1];
if (tplHash && TEMPLATES.some(t => t[0] === tplHash)) {
  const t = TEMPLATES.find(x => x[0] === tplHash), prev = hist.slice(0, hi + 1);
  loadDoc(t[3](), false); hist = prev.concat(hist); hi = hist.length - 1;
  try { history.replaceState(null, '', location.pathname); } catch (_) {}
}
requestAnimationFrame(() => { fitView(); renderProps(); });
